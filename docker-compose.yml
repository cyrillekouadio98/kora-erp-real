# Environnement de développement local : PostgreSQL + API + interface.
# Lancement : docker compose up --build   puis ouvrir http://localhost:3000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./infra/db/create-databases.sh:/docker-entrypoint-initdb.d/zz-create-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kora"]
      interval: 3s
      retries: 20

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env.example
    environment:
      DATABASE_OWNER_URL: postgres://kora_owner:kora_owner_dev@db:5432/kora
      DATABASE_APP_URL: postgres://kora_app:kora_app_dev@db:5432/kora
      DATABASE_PLATFORM_URL: postgres://kora_platform:kora_platform_dev@db:5432/kora
    command: sh -c "node dist/db/migrate.js && node dist/db/seed.js && node dist/main.js"
    ports: ["3001:3001"]
    depends_on: { db: { condition: service_healthy } }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      API_URL: http://api:3001
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
